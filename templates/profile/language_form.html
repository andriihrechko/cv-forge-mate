{% extends "base.html" %}

{% block title %}Language{% endblock %}

{% block content %}
  <div class="container d-flex justify-content-center py-4">
    <div class="card p-4 shadow-sm border-0 w-100" style="max-width: 800px;">
      <div class="d-flex justify-content-between align-items-center gap-3 mb-2">
        <h2 class="fw-bold">Language</h2>
        <a href="{% url "profile:profile" %}" class="btn btn-outline-light-blue">Back to profile</a>
      </div>

      <p class="text-muted small">All fields are required.</p>

      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form.html" %}
        <div class="d-grid my-4">
          <button type="submit" class="btn btn-light-blue">Save</button>
        </div>
      </form>
      {% if object %}
        <form action="{% url "profile:language-delete" language.pk %}" method="post">
          {% csrf_token %}
          <div class="d-grid">
            <button type="submit" class="btn btn-danger">Delete</button>
          </div>
        </form>
      {% endif %}
    </div>
  </div>
{% endblock %}
