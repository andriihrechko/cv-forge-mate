{% load static %}
{% if templates %}
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4 p-4">
    {% for template in templates %}
      <div class="col">
        <div class="card h-100 shadow-sm border-0 rounded-3 overflow-hidden custom-hover-card">

          <div class="position-relative">
            {% if template.preview_image %}
              <img src="{{ template.preview_image.url }}" class="card-img-wrapper" alt="{{ template.title }}">
            {% endif %}
          </div>

          <div class="card-body d-flex flex-column justify-content-between p-3 bg-white">
            <div class="mb-3">
              <p class="card-title fw-semibold text-dark mb-1">{{ template.title }}</p>
            </div>

            <div class="d-flex justify-content-center">
              <a href="{% url "catalog:template-detail" slug=template.slug %}" class="btn btn-light-blue w-100 text-center">Use</a>
            </div>

          </div>

        </div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="text-center py-5">
    <p class="text-muted italic fs-5">There are no templates.</p>
  </div>
{% endif %}
