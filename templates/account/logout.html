{% extends "base.html" %}

{% block title %}
  Sign Out
{% endblock title %}

{% block content %}
  <div class="container d-flex justify-content-center py-5">
    <div class="card p-4 shadow-sm border-0 w-100" style="max-width: 700px;">
      <h2 class="fw-semibold mb-4">Sign Out</h2>
      <p class="text-muted">Are you sure you want to sign out?</p>

      <form method="post" action="{% url "account_logout" %}">
        {% csrf_token %}
        {{ redirect_field }}
        <div class="d-grid gap-2 mt-4">
          <button type="submit" class="btn btn-outline-danger">Sign Out</button>
          <a href="{% url "profile:profile" %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>

    </div>
  </div>
{% endblock content %}
